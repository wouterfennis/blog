title: Wouter Compiles IT
tagline: "Software Engineering Blog by Wouter Fennis"
description: >-
  Personal blog by Wouter Fennis — Software Engineer and Scrum Master.
  Posts about Microsoft/.NET development, Azure, CI/CD, architecture, and Scrum.
url: "https://woutercompiles.it"
baseurl: ""

author:
  name: Wouter Fennis
  role: "Software Engineer and Scrum Master"
  linkedin: https://www.linkedin.com/in/wouter-fennis/
  github: https://github.com/wouterfennis

theme: minima

header_pages:
  - about.md
  - category/programming.md
  - category/ci-cd.md
  - category/scrum.md
  - category/architecture.md

# Minima theme settings
minima:
  skin: auto
  google_analytics: G-SZPGCBPM4T
  social_links:
    - { platform: github, user_url: "https://github.com/wouterfennis" }
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/wouter-fennis/" }

google_analytics: G-SZPGCBPM4T

# Pagination (optional, requires jekyll-paginate plugin)
# paginate: 5
# paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Permalinks matching original WordPress URL structure
permalink: /:year/:month/:day/:title/

# Collections / defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Wouter Fennis"

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Sass warning controls for Ruby 3.4 + minima 2.5 (theme internals still use deprecated APIs)
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
  - vendor
